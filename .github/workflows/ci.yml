name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['claude/**']

# push と pull_request が同一コミットで二重に走るのを防ぐため、
# ref ではなく SHA でグループ化する。
concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    # macos-14 は Xcode 15.4 で、XcodeGen が生成する project format 77 を
    # 読めない ("cannot be opened because it is in a future Xcode project
    # file format")。format 77 には Xcode 16 以降が必要。
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make generate

      - name: Run tests
        run: bash ./scripts/test.sh
