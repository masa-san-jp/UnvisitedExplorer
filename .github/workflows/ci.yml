name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['claude/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # iOS 17 SDK が必要 (project.yml の deploymentTarget)。
    # macOS ランナーは Linux の10倍のレートで課金されるため、
    # トリガーは PR と作業ブランチに絞っている。
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make generate

      - name: Run tests
        run: bash ./scripts/test.sh
