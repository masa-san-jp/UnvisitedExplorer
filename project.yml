name: UnvisitedExplorer
options:
  bundleIdPrefix: jp.masa
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic

targets:
  UnvisitedExplorer:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
    info:
      path: Config/iOS-Info.plist
    entitlements:
      path: Config/iOS.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.masa.UnvisitedExplorer
        # ホーム画面の表示名は Info.plist の CFBundleDisplayName (未踏マップ) が担う。
        # PRODUCT_NAME を非ASCIIにするとバンドル名が 未踏マップ.app になり、
        # XcodeGen がターゲット名から組み立てる TEST_HOST が実体と食い違う。
        # モジュール名のサニタイズ問題も同時に起きるため、ここは ASCII に保つ。
        PRODUCT_NAME: UnvisitedExplorer
        INFOPLIST_FILE: Config/iOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: UnvisitedExplorerWatch
        embed: true

  UnvisitedExplorerWatch:
    type: application.watchapp2
    platform: watchOS
    sources:
      - path: Sources/Shared
      - path: Sources/watchOS
    info:
      path: Config/watchOS-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.masa.UnvisitedExplorer.watchkitapp
        # iOS 側と同じ理由で ASCII に保つ。表示名は CFBundleDisplayName。
        PRODUCT_NAME: UnvisitedExplorerWatch
        INFOPLIST_FILE: Config/watchOS-Info.plist
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"

  UnvisitedExplorerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/UnvisitedExplorerTests
    dependencies:
      - target: UnvisitedExplorer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.masa.UnvisitedExplorerTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  UnvisitedExplorer:
    build:
      targets:
        UnvisitedExplorer: all
        UnvisitedExplorerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UnvisitedExplorerTests
