name: UnvisitedExplorer
options:
  bundleIdPrefix: jp.masa
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic

targets:
  UnvisitedExplorer:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
    # `info:` は指定しない。指定すると XcodeGen が Config/iOS-Info.plist を
    # 生成し直し、手書きの UIBackgroundModes・BGTaskSchedulerPermittedIdentifiers・
    # 位置情報の許可文言がすべて失われる。plist は INFOPLIST_FILE で
    # そのまま参照させ、リポジトリ側を唯一の正とする。
    entitlements:
      path: Config/iOS.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.masa.UnvisitedExplorer
        # ホーム画面の表示名は Info.plist の CFBundleDisplayName (未踏マップ) が担う。
        # PRODUCT_NAME を非ASCIIにするとバンドル名が 未踏マップ.app になり、
        # XcodeGen がターゲット名から組み立てる TEST_HOST が実体と食い違う。
        # モジュール名のサニタイズ問題も同時に起きるため、ここは ASCII に保つ。
        PRODUCT_NAME: UnvisitedExplorer
        INFOPLIST_FILE: Config/iOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        # .xcodeproj は生成物なので、Xcode の画面で Team を選んでも
        # 再生成のたびに消える。環境変数から流し込めるようにしておく。
        #   export DEVELOPMENT_TEAM=XXXXXXXXXX
        # 未設定なら空になり、従来どおり Xcode 側で選ぶ運用になる。
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    # Watch は当面 iOS ターゲットに embed しない (Issue #10 の R3)。
    # embed すると watchOS 側のバイナリ生成が二重定義になり、iOS のビルド自体が
    # 通らない ("Multiple commands produce ... UnvisitedExplorerWatch")。
    # Watch は手動セッション記録専用で L0/L1/L2 とは無関係のため、
    # 位置記録の検証を優先して切り離す。復帰は下記4行を戻すだけ。
    #
    # dependencies:
    #   - target: UnvisitedExplorerWatch
    #     embed: true

  # ターゲット定義自体は残す (単体でビルド・検証は可能)。
  UnvisitedExplorerWatch:
    type: application.watchapp2
    platform: watchOS
    sources:
      - path: Sources/Shared
      - path: Sources/watchOS
    # iOS 側と同じ理由で `info:` は指定しない。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.masa.UnvisitedExplorer.watchkitapp
        # iOS 側と同じ理由で ASCII に保つ。表示名は CFBundleDisplayName。
        PRODUCT_NAME: UnvisitedExplorerWatch
        INFOPLIST_FILE: Config/watchOS-Info.plist
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}

  UnvisitedExplorerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/UnvisitedExplorerTests
    dependencies:
      - target: UnvisitedExplorer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.masa.UnvisitedExplorerTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  UnvisitedExplorer:
    build:
      targets:
        UnvisitedExplorer: all
        UnvisitedExplorerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UnvisitedExplorerTests
